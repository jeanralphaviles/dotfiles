general {
  output_format = "i3bar"
  colors = true
  interval = 1
}

order += "cpu_usage"
order += "ethernet _first_"
order += "tztime london"
order += "tztime new_york"
order += "tztime utc"
order += "tztime local"

cpu_usage {
  format = "%usage"
}

ethernet _first_ {
  format_up = "%ip (%speed)"
}

tztime local {
  format = "%A %B %d, %Y %H:%M:%S"
  timezone = "America/Los_Angeles"
}

tztime london {
  format = "London %H:%M:%S"
  timezone = "Europe/London"
}

tztime new_york {
  format = "New York %H:%M:%S"
  timezone = "America/New_York"
}

tztime utc {
  format = "UTC %H:%M:%S"
  timezone = "Etc/UTC"
}
